spring.application.name=druckauftrag-manager
server.port=8080

# H2 als Datei-Datenbank im Ordner ./data, damit die Daten nach einem Neustart erhalten bleiben
spring.datasource.url=jdbc:h2:file:./data/druckauftrag
spring.datasource.username=sa
spring.datasource.password=

# Tabellen aus den Entities erzeugen bzw. anpassen, vorhandene Daten bleiben erhalten
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Fehlermeldung (z. B. "Kunde nicht gefunden") auf der Fehlerseite anzeigen
server.error.include-message=always
